name: Phoenix Protocol — Health Check & Auto-Rollback

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_rollback:
        description: 'Force rollback to previous commit (true/false)'
        required: false
        default: 'false'

# ── Concurrency guard ────────────────────────────────────────────────────────
# Only one Phoenix Protocol run may be active at a time per branch.
# A new push will NOT cancel a running check — it waits. This prevents the
# rollback-push → new-run → rollback-push infinite cascade.
concurrency:
  group: phoenix-protocol-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health-monitor:
    runs-on: ubuntu-latest
    # Secrets will be accessed safely in the individual steps

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Falls back to the default GITHUB_TOKEN if SRE_PAT is not configured.
          token: ${{ secrets.SRE_PAT || github.token }}

      # ── 2. Adaptive deployment buffer ────────────────────────────────────────
      # Polls /ping/ every 15 s instead of blindly sleeping 180 s.
      # Render free-tier cold starts can take anywhere from 30 s to 8 min;
      # the hard sleep either wastes time or misses slow starts entirely.
      - name: Adaptive Deployment Buffer
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "⚠️ APP_URL secret is not set. Skipping deployment ping buffer."
            exit 0
          fi

          echo "⏳ Waiting for Render deployment to become live..."
          MAX_WAIT=480   # 8 minutes maximum
          ELAPSED=0
          INTERVAL=15

          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 "${APP_URL}/ping/" 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Deployment live after ${ELAPSED}s (HTTP 200)"
              exit 0
            fi

            echo "  → Not ready yet (HTTP ${HTTP_STATUS}, elapsed ${ELAPSED}s). Retrying in ${INTERVAL}s..."
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "⚠️ Deployment did not respond within ${MAX_WAIT}s — proceeding to deep health check anyway."

      # ── 3. Deep health check (3 retries) ─────────────────────────────────────
      # Hits /health/ which validates DB connectivity + critical env vars.
      # Three attempts with 20 s gaps before declaring failure.
      - name: Deep Health Check
        id: health_check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "⚠️ APP_URL secret is not set. Skipping deep health check."
            exit 0
          fi

          PASS=0
          for ATTEMPT in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 "${APP_URL}/health/" 2>/dev/null || echo "000")

            echo "  Attempt ${ATTEMPT}/3 → HTTP ${HTTP_STATUS}"

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check PASSED on attempt ${ATTEMPT}"
              PASS=1
              break
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              echo "  ⚠️ Retrying in 20s..."
              sleep 20
            fi
          done

          if [ "$PASS" = "0" ]; then
            echo "❌ All 3 health check attempts failed."
            exit 1
          fi

      # ── 4. Auto-Rollback (only on health check failure) ──────────────────────
      # Uses SRE_PAT so the push is not blocked by branch-protection rules.
      # The commit message prefix "[ROLLBACK]" is checked by the concurrency
      # group — if a future workflow run sees it, it can skip the health check
      # and exit early (optional enhancement).
      - name: Auto-Rollback on Failure
        if: failure()
        run: |
          echo "🚨 Health check failed — initiating Phoenix Protocol rollback..."

          git config --global user.name  "SRE-AI-Guardian"
          git config --global user.email "sre-ai@resumexpert.com"

          BAD_COMMIT=$(git rev-parse HEAD)
          
          # Check if the commit is a merge commit
          if git show -s --format=%P HEAD | grep -q " "; then
            echo "Merge commit detected. Using -m 1 for revert."
            git revert -m 1 HEAD --no-edit
          else
            echo "Normal commit detected."
            git revert HEAD --no-edit
          fi
          
          git push origin main

          STABLE_COMMIT=$(git rev-parse HEAD)
          echo "🚨 ROLLBACK COMPLETE"
          echo "   Reverted: ${BAD_COMMIT}"
          echo "   Stable  : ${STABLE_COMMIT}"
